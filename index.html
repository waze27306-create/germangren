<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touch The Girl - WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden;
            touch-action: none; /* Запрещает браузерные жесты */
        }
        #game-container {
            width: 100vw; height: 100vh;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Принудительный альбомный режим (запрос ориентации)
        if (window.screen.orientation && window.screen.orientation.lock) {
            window.screen.orientation.lock('landscape').catch(() => {});
        }

        // 2. Блокировка закрытия через кнопку "Назад" (нативная кнопка в ТГ)
        tg.enableClosingConfirmation();

        // 3. Обработка нажатия на "крестик" (MainButton или закрытие)
        // В Telegram Web App нет прямого события на крестик, 
        // но мы можем перехватить событие закрытия, если пользователь нажал на него
        tg.onEvent('viewportChanged', () => {
            // Если нужно, чтобы при попытке закрыть вылезал алерт
            // tg.showPopup({
            //     title: 'Выход',
            //     message: 'Вы уверены, что хотите выйти из игры?',
            //     buttons: [{type: 'ok', text: 'Да'}, {type: 'cancel'}]
            // });
        });

        // 4. Защита от свайпов
        document.body.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Запуск Ruffle
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = "100%";
            player.style.height = "100%";
            
            const container = document.getElementById("game-container");
            container.appendChild(player);
            
            player.load("touchthegirl.swf"); 
        });
    </script>
</body>
</html>
