<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Touch The Girl - WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 100vw; height: 100vh;
        }
        .error-msg { color: white; font-family: sans-serif; text-align: center; padding-top: 20%; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // --- ЗАЩИТА ---
        const tg = window.Telegram.WebApp;
        
        // 1. Проверка: запущен ли проект в Telegram
        if (!tg.initData || tg.initData === "") {
            document.body.innerHTML = "<div class='error-msg'><h1>Эээ, браток, ты не с ТГ зашел, пиздуй-ка ты лесом!</h1></div>";
            throw new Error("Access Denied");
        }

        // 2. Проверка: запущен ли проект через твоего бота
        const MY_BOT_ID = 7967862064; 
        const botId = tg.initDataUnsafe.receiver ? tg.initDataUnsafe.receiver.id : null;
        
        if (botId && botId !== MY_BOT_ID) {
            document.body.innerHTML = "<div class='error-msg'><h1>Нене, браток, соси писю, обойдешься, только в оригинальном боте запущусь!</h1></div>";
            throw new Error("Access Denied: Wrong Bot");
        }
        // --- КОНЕЦ ЗАЩИТЫ ---

        tg.ready();
        tg.expand();

        // Принудительный фуллскрин
        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }

        // Принудительный альбомный режим
        if (window.screen.orientation && window.screen.orientation.lock) {
            window.screen.orientation.lock('landscape').catch(() => {});
        }

        // Подтверждение при закрытии (крестик)
        tg.enableClosingConfirmation();

        // Защита от свайпов
        document.body.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Запуск Ruffle
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = "100%";
            player.style.height = "100%";
            const container = document.getElementById("game-container");
            container.appendChild(player);
            player.load("touchthegirl.swf"); 
        });
    </script>
</body>
</html>
